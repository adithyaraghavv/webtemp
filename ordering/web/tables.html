<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table QR codes</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="ui.css">
<style>@media print{body{background:var(--paper);color:var(--bg)}.noprint{display:none}.panel{break-inside:avoid;border-color:var(--bg)}}
.panel{text-align:center}.panel h2{margin-bottom:8px}</style>
</head><body>
<main class="wrap" id="app"></main>
<script src="config.js"></script><script src="api.js"></script><script src="qr.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  async function go() {
    if (!API.signedIn()) { app.appendChild(el('p', {}, ['Please ', el('a', { href: 'staff.html', text: 'sign in' }), ' first.'])); return; }
    var name = 'Order here', rows = [];
    try { var s = await API.get('settings?select=cafe_name'); if (s[0]) name = s[0].cafe_name; rows = await API.get('cafe_tables?select=label,secret&active=eq.true&order=label.asc'); }
    catch (e) { app.appendChild(el('p', { text: 'Could not load tables. Sign in again.' })); return; }
    var base = location.href.replace(/[^/]*$/, '') + 'order.html';
    app.appendChild(el('div', { class: 'noprint' }, [el('h1', { text: 'Table QR codes' }), el('p', { class: 'muted', text: 'Print this page. Each code opens the menu for that table only. Keep the printed codes on the tables; do not post them online.' }),
      el('button', { class: 'btn', text: 'Print', onclick: function () { print(); } })]));
    var g = el('div', { class: 'grid2' });
    rows.forEach(function (r) {
      var url = base + '?t=' + encodeURIComponent(r.label) + '&k=' + encodeURIComponent(r.secret), box = el('div', { class: 'qr' });
      box.innerHTML = QR.svg(url, { scale: 5, margin: 1, dark: '#150c0b', light: '#fff7f1' });
      g.appendChild(el('div', { class: 'panel' }, [el('h2', { text: 'Table ' + r.label }), box, el('p', { class: 'muted', text: 'Scan to order · ' + name })]));
    });
    app.appendChild(g);
  }
  go();
})();
</script></body></html>
