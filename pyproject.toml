[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webbuild"
version = "0.5.0"
description = "Own-it website and landing page builder kit for Claude Code"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
webbuild = "webbuild.cli:main"

[tool.setuptools]
packages = ["webbuild"]

[tool.setuptools.package-data]
webbuild = ["ordering_kit/web/*", "ordering_kit/supabase/*"]
