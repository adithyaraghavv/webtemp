<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order at your table</title>
<meta name="description" content="Order from your table and pay when you are done.">
<meta name="theme-color" content="#150c0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head><body>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="config.js"></script><script src="api.js"></script><script src="qr.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), TABLE = q.get('t'), SECRET = q.get('k');
  var app = document.getElementById('app');
  var state = { cafe: { cafe_name: '', currency: 'Rs ' }, menu: [], cart: {}, token: null, bill: null, pay: null, view: 'menu', busy: false, err: '' };
  var KEY = 'bill:' + TABLE;
  try { state.token = sessionStorage.getItem(KEY); } catch (e) {}
  var poll = null;

  function total() { var t = 0; state.menu.forEach(function (m) { t += (state.cart[m.id] || 0) * m.price_paise; }); return t; }
  function count() { var n = 0; for (var k in state.cart) n += state.cart[k]; return n; }
  function say(msg) { state.err = msg; render(); }
  function friendly(e) {
    var m = e.message || '';
    if (/unknown table/.test(m)) return 'This QR code is not valid. Please ask the staff.';
    if (/too many orders/.test(m)) return 'You have sent several orders already. Please ask the staff.';
    if (/being settled/.test(m)) return 'The bill for this table has been requested. Please ask the staff to add more.';
    if (/not available/.test(m)) return 'One of the items is no longer available. Please refresh.';
    return 'Could not do that. Please try again or ask the staff.';
  }

  async function init() {
    if (!TABLE || !SECRET) { state.view = 'scan'; return render(); }
    try {
      var c = await API.rpc('get_cafe'); if (c) state.cafe = c;
      state.menu = await API.get('menu_items?select=*&order=category_order.asc,category.asc,sort.asc,name.asc');
      if (state.token) { state.bill = await API.rpc('get_bill', { p_token: state.token }); if (state.bill) state.view = 'bill'; }
    } catch (e) { state.err = 'Could not load the menu. Please check your connection.'; }
    render(); startPoll();
  }
  function startPoll() {
    if (poll) clearInterval(poll);
    poll = setInterval(async function () {
      if (!state.token || state.view === 'menu' || state.view === 'cart') return;
      try { state.bill = await API.rpc('get_bill', { p_token: state.token }); render(); } catch (e) {}
    }, 5000);
  }

  function render() {
    app.textContent = '';
    var cur = state.cafe.currency;
    app.appendChild(el('header', { class: 'top' }, [el('h1', { text: state.cafe.cafe_name || 'Order' }), el('span', { class: 'tag', text: TABLE ? 'Table ' + TABLE : '' })]));
    if (state.err) app.appendChild(el('div', { class: 'msg err', role: 'alert', text: state.err }));
    if (state.view === 'scan') { app.appendChild(el('p', { text: 'Scan the QR code on your table to order.' })); return; }
    if (state.view === 'menu') return renderMenu(cur);
    if (state.view === 'cart') return renderCart(cur);
    if (state.view === 'bill') return renderBill(cur);
    if (state.view === 'rate') return renderRate();
    if (state.view === 'pay') return renderPay(cur);
  }

  function renderMenu(cur) {
    if (state.token && state.bill) app.appendChild(el('button', { class: 'btn ghost', onclick: function () { state.view = 'bill'; render(); }, text: 'Back to my bill' }));
    var last = null;
    state.menu.forEach(function (m) {
      if (m.category !== last) { app.appendChild(el('h2', { class: 'cat', text: m.category })); last = m.category; }
      var n = state.cart[m.id] || 0;
      var step = el('div', { class: 'step' }, [
        el('button', { 'aria-label': 'Remove one ' + m.name, onclick: function () { if (n > 0) { state.cart[m.id] = n - 1; if (!state.cart[m.id]) delete state.cart[m.id]; render(); } }, text: '−' }),
        el('span', { 'aria-live': 'polite', text: String(n) }),
        el('button', { 'aria-label': 'Add one ' + m.name, onclick: function () { if (n < 20) { state.cart[m.id] = n + 1; render(); } }, text: '+' })]);
      app.appendChild(el('div', { class: 'item' }, [el('h3', { text: m.name }), step, el('p', { text: money(m.price_paise, cur) + (m.description ? ' · ' + m.description : '') })]));
    });
    if (count()) {
      app.appendChild(el('div', { class: 'bar' }, [el('div', { class: 'in' }, [
        el('div', { text: count() + (count() === 1 ? ' item · ' : ' items · ') + money(total(), cur) }),
        el('button', { class: 'btn', onclick: function () { state.view = 'cart'; render(); }, text: 'Review order' })])]));
    }
  }

  function renderCart(cur) {
    app.appendChild(el('h2', { text: 'Your order' }));
    var p = el('div', { class: 'panel' });
    state.menu.forEach(function (m) { var n = state.cart[m.id]; if (n) p.appendChild(el('div', { class: 'row' }, [el('span', { text: n + ' × ' + m.name }), el('span', { text: money(n * m.price_paise, cur) })])); });
    p.appendChild(el('div', { class: 'row total' }, [el('span', { text: 'Total' }), el('span', { text: money(total(), cur) })]));
    app.appendChild(p);
    app.appendChild(el('label', { for: 'note', text: 'Note for the kitchen (optional)' }));
    app.appendChild(el('textarea', { id: 'note', rows: '2', maxlength: '300' }));
    app.appendChild(el('p', { class: 'muted', text: 'The final bill is worked out from the menu prices when you ask for it.' }));
    var send = el('button', { class: 'btn', onclick: place, text: state.busy ? 'Sending…' : 'Send order to the kitchen' });
    if (state.busy) send.disabled = true;
    app.appendChild(el('div', { class: 'row' }, [el('button', { class: 'btn ghost', onclick: function () { state.view = 'menu'; render(); }, text: 'Back' }), send]));
  }

  async function place() {
    var items = []; for (var id in state.cart) items.push({ id: id, qty: state.cart[id] });
    var note = (document.getElementById('note') || {}).value || '';
    state.busy = true; state.err = ''; render();
    try {
      var r = await API.rpc('place_order', { p_table: TABLE, p_secret: SECRET, p_items: items, p_note: note });
      state.token = r.bill_token; try { sessionStorage.setItem(KEY, state.token); } catch (e) {}
      state.cart = {}; state.bill = await API.rpc('get_bill', { p_token: state.token }); state.view = 'bill'; state.busy = false; render(); startPoll();
    } catch (e) { state.busy = false; say(friendly(e)); }
  }

  function renderBill(cur) {
    var b = state.bill;
    if (!b) { app.appendChild(el('p', { text: 'No orders yet.' })); state.view = 'menu'; return; }
    if (b.status === 'paid') return renderThanks();
    app.appendChild(el('h2', { text: 'Your table' }));
    var p = el('div', { class: 'panel' });
    (b.lines || []).forEach(function (l) { p.appendChild(el('div', { class: 'row' }, [el('span', {}, [l.qty + ' × ' + l.name + ' ', el('span', { class: 'pill ' + l.order_status, text: l.order_status })]), el('span', { text: money(l.qty * l.price_paise, cur) })])); });
    p.appendChild(el('div', { class: 'row total' }, [el('span', { text: 'Total so far' }), el('span', { text: money(b.total_paise, cur) })]));
    app.appendChild(p);
    var row = el('div', { class: 'row' });
    if (b.status === 'open') row.appendChild(el('button', { class: 'btn ghost', onclick: function () { state.view = 'menu'; render(); }, text: 'Order more' }));
    row.appendChild(el('button', { class: 'btn', onclick: askBill, text: b.status === 'open' ? 'Ask for the bill' : 'Show payment' }));
    app.appendChild(row);
  }

  async function askBill() {
    state.err = '';
    try {
      state.pay = await API.rpc('request_bill', { p_token: state.token });
      state.view = (state.pay.rated || state.bill.rated || state.pay.status === 'paid') ? 'pay' : 'rate'; render();
    } catch (e) { say('Could not get the bill yet. Please ask the staff.'); }
  }

  function renderRate() {
    var stars = 0, comment = '';
    app.appendChild(el('h2', { text: 'How was your visit?' }));
    app.appendChild(el('p', { class: 'muted', text: 'Optional. You can skip this and go straight to payment.' }));
    var box = el('div', { class: 'stars', role: 'group', 'aria-label': 'Rating' });
    function paint() { Array.prototype.forEach.call(box.children, function (b, i) { b.className = i < stars ? 'on' : ''; b.setAttribute('aria-pressed', i < stars ? 'true' : 'false'); }); submit.disabled = !stars; }
    for (var i = 1; i <= 5; i++) (function (n) { box.appendChild(el('button', { 'aria-label': n + (n === 1 ? ' star' : ' stars'), onclick: function () { stars = n; paint(); }, text: '★' })); })(i);
    app.appendChild(box);
    var ta = el('textarea', { rows: '2', maxlength: '500', placeholder: 'Anything we should know? (optional)', 'aria-label': 'Comment' });
    app.appendChild(ta);
    var submit = el('button', { class: 'btn', text: 'Submit and pay', onclick: async function () {
      try { await API.rpc('submit_rating', { p_token: state.token, p_stars: stars, p_comment: ta.value }); } catch (e) {}
      state.view = 'pay'; render(); } });
    app.appendChild(el('div', { class: 'row' }, [el('button', { class: 'btn ghost', text: 'Skip', onclick: function () { state.view = 'pay'; render(); } }), submit]));
    paint();
  }

  function upiLink(p) {
    var amount = (p.total_paise / 100).toFixed(2);
    var enc = function (s) { return encodeURIComponent(s).replace(/%40/g, '@'); };
    return 'upi://pay?pa=' + enc(p.upi_id) + '&pn=' + enc(p.upi_name || p.cafe_name) + '&am=' + amount + '&cu=INR&tn=' + enc((p.cafe_name || 'Bill') + ' ' + p.bill_ref);
  }
  function renderPay(cur) {
    var p = state.pay;
    if (state.bill && state.bill.status === 'paid') return renderThanks();
    app.appendChild(el('h2', { text: 'Pay' }));
    app.appendChild(el('div', { class: 'panel center' }, [el('div', { class: 'muted', text: 'Amount to pay' }), el('div', { style: 'font-size:2.4rem;font-weight:700', text: money(p.total_paise, cur) })]));
    if (p.upi_id) {
      var link = upiLink(p), holder = el('div', { class: 'center' });
      var wrap = el('div', { class: 'qr' }); wrap.innerHTML = QR.svg(link, { scale: 6, margin: 1, dark: '#150c0b', light: '#fff7f1' });
      holder.appendChild(wrap);
      app.appendChild(holder);
      app.appendChild(el('p', { class: 'center muted', text: 'Scan with any UPI app, or tap below on this phone.' }));
      app.appendChild(el('div', { class: 'center' }, [el('a', { class: 'btn', href: link, text: 'Open UPI app' })]));
    } else app.appendChild(el('p', { text: 'Please pay at the counter.' }));
    app.appendChild(el('p', { class: 'center muted', text: 'After paying, the staff will confirm and this screen will update.' }));
  }

  function renderThanks() {
    app.appendChild(el('h2', { text: 'Thank you' }));
    app.appendChild(el('p', { text: 'Payment confirmed. We hope to see you again.' }));
    var gid = state.cafe.google_place_id;
    if (gid) app.appendChild(el('p', {}, [el('a', { class: 'btn ghost', rel: 'noopener', href: 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(gid), text: 'Leave a Google review' })]));
    try { sessionStorage.removeItem(KEY); } catch (e) {}
  }
  init();
})();
</script></body></html>
